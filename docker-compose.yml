# Local development dependencies. Run: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: agriconnect-mongo
    # A single-node replica set so Mongoose transactions work locally (needed for checkout in Prompt 10).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
